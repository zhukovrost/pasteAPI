definitions:
  models.Metadata:
    properties:
      current_page:
        type: integer
      first_page:
        type: integer
      last_page:
        type: integer
      page_size:
        type: integer
      total_records:
        type: integer
    type: object
  models.Paste:
    properties:
      can_edit:
        type: boolean
      category:
        type: integer
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: integer
      text:
        type: string
      title:
        type: string
      version:
        type: integer
    type: object
  models.Permission:
    properties:
      paste_id:
        type: integer
      user_id:
        type: integer
    type: object
  models.Token:
    properties:
      expiry:
        type: string
      token:
        type: string
    type: object
  models.User:
    properties:
      activated:
        type: boolean
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      login:
        type: string
    type: object
  service.ActivateUserInput:
    properties:
      token:
        type: string
    type: object
  service.AuthInput:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  service.AuthResp:
    properties:
      authentication_token:
        $ref: '#/definitions/models.Token'
    type: object
  service.CreatePasteInput:
    properties:
      category:
        type: integer
      minutes:
        type: integer
      text:
        type: string
      title:
        type: string
    type: object
  service.ListPastesOutput:
    properties:
      metadata:
        $ref: '#/definitions/models.Metadata'
      pastes:
        items:
          $ref: '#/definitions/models.Paste'
        type: array
    type: object
  service.PastePermissionResponse:
    properties:
      permission:
        $ref: '#/definitions/models.Permission'
    type: object
  service.PasteResp:
    properties:
      paste:
        $ref: '#/definitions/models.Paste'
    type: object
  service.RegistrationInput:
    properties:
      email:
        type: string
      login:
        type: string
      password:
        type: string
    type: object
  service.ResetPasswordInput:
    properties:
      email:
        type: string
    type: object
  service.ResetPasswordResp:
    properties:
      message:
        type: string
    type: object
  service.UpdatePasswordInput:
    properties:
      password:
        type: string
      token:
        type: string
    type: object
  service.UpdatePasswordResponse:
    properties:
      message:
        type: string
    type: object
  service.UpdatePasteInput:
    properties:
      category:
        type: integer
      minutes:
        type: integer
      text:
        type: string
      title:
        type: string
    type: object
  service.UserResp:
    properties:
      user:
        $ref: '#/definitions/models.User'
    type: object
  v1.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  v1.HealthCheckOutput:
    properties:
      status:
        type: string
      system_info:
        properties:
          environment:
            type: string
          version:
            type: string
        type: object
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is a Paste API server. It is used to publish, read, edit text
    posts.
  title: Paste API
  version: "1.0"
paths:
  /api/v1/healthcheck:
    get:
      description: Retrieves status of the application
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved paste
          schema:
            $ref: '#/definitions/v1.HealthCheckOutput'
        "429":
          description: Too many requests, rate limit exceeded
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Health check
      tags:
      - app
  /api/v1/pastes/:
    get:
      description: Retrieves a paste from the database by its ID.
      parameters:
      - description: Title of the paste
        in: query
        name: title
        type: string
      - description: Category ID of the paste
        in: query
        name: category
        type: integer
      - description: Get pastes, which current user can update
        in: query
        name: onlyUsers
        type: boolean
      - description: Sort order, e.g., -created_at
        in: query
        name: sort
        type: string
      - description: Page number for pagination
        in: query
        name: page
        type: integer
      - description: Number of items per page
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved paste
          schema:
            $ref: '#/definitions/service.ListPastesOutput'
        "422":
          description: Unprocessing data
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "429":
          description: Too many requests, rate limit exceeded
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Retrieve a paste
      tags:
      - pastes
    post:
      consumes:
      - application/json
      description: Creates a new paste in the database by input data.
      parameters:
      - description: Paste creation input
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.CreatePasteInput'
      produces:
      - application/json
      responses:
        "201":
          description: Successfully created paste
          headers:
            Location:
              description: URL of the newly created paste
              type: string
          schema:
            $ref: '#/definitions/service.PasteResp'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "422":
          description: Unprocessable data
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "429":
          description: Too many requests, rate limit exceeded
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new paste
      tags:
      - pastes
  /api/v1/pastes/{id}:
    delete:
      description: Deletes a paste from the database by its ID.
      parameters:
      - description: Paste ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Successfully deleted paste
        "403":
          description: User is not allowed to edit this paste
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Paste not found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "429":
          description: Too many requests, rate limit exceeded
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Deletes a paste
      tags:
      - pastes
    get:
      description: Retrieves a paste from the database by its ID.
      parameters:
      - description: Paste ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved paste
          schema:
            $ref: '#/definitions/service.PasteResp'
        "404":
          description: Paste not found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "429":
          description: Too many requests, rate limit exceeded
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Retrieve a paste
      tags:
      - pastes
    patch:
      consumes:
      - application/json
      description: Updates the paste in the database by ID and input data.
      parameters:
      - description: Paste ID
        in: path
        name: id
        required: true
        type: integer
      - description: Paste update input
        in: body
        name: body
        schema:
          $ref: '#/definitions/service.UpdatePasteInput'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully updated paste
          schema:
            $ref: '#/definitions/service.PasteResp'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "403":
          description: User is not allowed to edit this paste
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "422":
          description: Unprocessable data
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "429":
          description: Too many requests, rate limit exceeded
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update the paste
      tags:
      - pastes
  /api/v1/pastes/{id}/permission/{user_id}:
    put:
      description: Gives a permission to user in the url to update / delete paste
        in the url.
      parameters:
      - description: Paste ID
        in: path
        name: id
        required: true
        type: integer
      - description: User ID
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Successfully gave permission
          schema:
            $ref: '#/definitions/service.PastePermissionResponse'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "429":
          description: Too many requests, rate limit exceeded
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Gives a write permission
      tags:
      - pastes
      - users
  /api/v1/tokens/authentication:
    post:
      consumes:
      - application/json
      description: Creates a new user token in the database by input data.
      parameters:
      - description: User registration input
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.AuthInput'
      produces:
      - application/json
      responses:
        "201":
          description: Successfully created
          schema:
            $ref: '#/definitions/service.AuthResp'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "422":
          description: Unprocessable data
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "429":
          description: Too many requests, rate limit exceeded
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Authentication
      tags:
      - users
      - tokens
  /api/v1/tokens/password-reset:
    post:
      consumes:
      - application/json
      description: Creates a new password reset token in the database by input email.
        Sends a reset password email.
      parameters:
      - description: Input email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.ResetPasswordInput'
      produces:
      - application/json
      responses:
        "202":
          description: Successfully accepted
          schema:
            $ref: '#/definitions/service.ResetPasswordResp'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "422":
          description: Unprocessable data
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "429":
          description: Too many requests, rate limit exceeded
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Password reset
      tags:
      - users
      - tokens
  /api/v1/users/:
    post:
      consumes:
      - application/json
      description: Creates a new user in the database by input data.
      parameters:
      - description: User registration input
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.RegistrationInput'
      produces:
      - application/json
      responses:
        "202":
          description: Successfully accepted
          schema:
            $ref: '#/definitions/service.UserResp'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "422":
          description: Unprocessable data
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "429":
          description: Too many requests, rate limit exceeded
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Registration
      tags:
      - users
  /api/v1/users/activated:
    put:
      consumes:
      - application/json
      description: Activates the user by input token.
      parameters:
      - description: User activation input
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.ActivateUserInput'
      produces:
      - application/json
      responses:
        "202":
          description: Successfully accepted
          schema:
            $ref: '#/definitions/service.UserResp'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "422":
          description: Unprocessable data
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "429":
          description: Too many requests, rate limit exceeded
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Activation
      tags:
      - users
  /api/v1/users/password:
    put:
      consumes:
      - application/json
      description: Update user's password by input data.
      parameters:
      - description: User activation input
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.UpdatePasswordInput'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully reset
          schema:
            $ref: '#/definitions/service.UpdatePasswordResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "422":
          description: Unprocessable data
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "429":
          description: Too many requests, rate limit exceeded
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Update password
      tags:
      - users
schemes:
- http
security:
- BearerAuth: []
securityDefinitions:
  BearerAuth:
    description: 'To authorize, use the format: Bearer <your_token>. For example:
      Bearer abc123xyz'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
