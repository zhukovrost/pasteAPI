  host: localhost
  port: 6379
  password: ""
  db: 0
  expiration: 15m
rabbitmq:
  url: amqp://guest:guest@localhost:5672/
  exchange: emails
  exchange_type: direct
  queue: user_emails
activation_link: http://localhost:8081/activate?token=
reset_link: http://localhost:8081/password_reset?token=