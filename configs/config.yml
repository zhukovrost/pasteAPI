host: 0.0.0.0
status: available
port: 8080
env: development
db:
  maxOpenConns: 30
  maxIdleConns: 10
  maxIdleTime: 10m
  dsn: postgres://pasteadmin:admin@localhost:5432/paste?sslmode=disable
logger:
  need_debug: true
limiter:
  rps: 4
  burst: 8
  enabled: true
cors:
