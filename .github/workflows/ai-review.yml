name: ai-review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Get PR diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git diff --no-color "origin/${BASE_REF}...HEAD" -- . \
            ':(exclude)*.lock' ':(exclude)*.sum' \
            ':(exclude)dist/**' ':(exclude)generated/**' \
            > "$RUNNER_TEMP/pr.diff"

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/review-bot/go.mod

      - name: Build review bot
        run: |
          set -euo pipefail
          cd tools/review-bot
          go build -o "$RUNNER_TEMP/ai-review" .

      - name: Run AI review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ai-review" \
            -diff "$RUNNER_TEMP/pr.diff" \
            -instructions "$GITHUB_WORKSPACE/.github/review-instructions.md" \
            -out "$RUNNER_TEMP/review.md"

      - name: Post review comment
        if: always()
        uses: actions/github-script@v7
        env:
          REVIEW_FILE: ${{ runner.temp }}/review.md
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              body = fs.readFileSync(process.env.REVIEW_FILE, 'utf8');
            } catch (e) {
              body = 'AI review не выполнен: файл с результатом не создан.';
            }
            if (body.length > 60000) body = body.slice(0, 60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
